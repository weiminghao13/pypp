[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypp-primitives"
version = "1.0.0"
description = "PyPP - Python Primitive Type Extensions: 为内置类型提供丰富的实用方法和类型转换"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Hao Hao" },
]
keywords = ["python", "types", "extensions", "utility", "primitive", "integer", "float", "string", "list", "boolean"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/weiminghao13/pypp"
"Bug Reports" = "https://github.com/weiminghao13/pypp/issues"
Source = "https://github.com/weiminghao13/pypp"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
]

[tool.setuptools.packages.find]
include = ["pypp*"]
exclude = ["test*", "tests*", "*.tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
